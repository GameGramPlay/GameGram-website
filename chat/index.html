<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameGram Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="../images/gamegram.png">
  <meta http-equiv="Cache-Control" content="no-store" />
</head>
<body data-theme="dark" data-msgstyle="cozy">

  <!-- Login overlay -->
  <div id="login" class="overlay">
    <div class="box">
      <div class="login-logo">GameGram Chat</div>
      <p class="login-sub">Public rooms powered by hack.chat</p>
      <input id="nickInput"  placeholder="Nickname"   autocomplete="off" />
      <input id="roomInput"  placeholder="Room  (default: gamegram)" autocomplete="off" />
      <button id="loginBtn" class="big-btn">Join Room</button>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../" class="back-link" title="Back to games">← Games</a>
      <span id="roomLabel" class="room-name">#gamegram</span>
    </div>
    <div class="sidebar-section-label">Online</div>
    <div id="userList"></div>
    <div class="self">
      <div class="me">
        <span id="meName">Guest</span>
        <span id="statusDot" class="status-dot disconnected">Connecting…</span>
      </div>
      <button id="settingsBtn" title="Settings" aria-label="Open settings">⚙</button>
    </div>
  </aside>

  <!-- Chat panel -->
  <main class="chat">
    <header class="chat-header">
      <span id="chatRoomDisplay">#gamegram</span>
    </header>
    <div id="messages"></div>
    <footer class="chat-footer">
      <input id="input" type="text" placeholder="Message…" autocomplete="off" />
      <button id="send">Send</button>
    </footer>
  </main>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div class="settings">
        <label>Nickname
          <input id="nickInputSettings" autocomplete="off" />
        </label>
        <label>Nickname Color
          <input type="color" id="nickColor" value="#7c3aed" />
        </label>
        <label>Theme
          <select id="themeSelect">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>Message Style
          <select id="msgStyle">
            <option value="cozy">Cozy</option>
            <option value="compact">Compact</option>
          </select>
        </label>
        <label>Font Size
          <input type="range" id="fontSize" min="12" max="20" value="14" />
        </label>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
