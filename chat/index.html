<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameGram Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8" />
  <link rel="icon" type="image/png" href="../images/gamegram.png">
  <meta http-equiv="Cache-Control" content="no-store" />
</head>
<body data-theme="dark" data-msgstyle="cozy">

  <!-- Play & Chat split-screen overlay -->
  <div class="pc-overlay hidden" id="playChatOverlay">
    <div class="pc-header">
      <span class="pc-icon">🎮</span>
      <span class="pc-title" id="pcGameTitle">Game</span>
      <div class="pc-actions">
        <a id="pcOpenTab" href="#" target="_blank" rel="noopener" class="pc-btn">⤢ New Tab</a>
        <button class="pc-btn pc-btn-close" id="pcClose">✕ Close</button>
      </div>
    </div>
    <div class="pc-body">
      <iframe id="pcGameFrame" class="pc-game" src="" allowfullscreen title="Game"></iframe>
      <div class="pc-chat-panel">
        <div class="pc-chat-top">
          <span>💬 Chat</span>
          <span id="pcRoomLabel" class="pc-room-tag">#gamegram</span>
        </div>
        <div class="pc-msgs" id="pcMessages"></div>
        <div class="pc-input-row">
          <input id="pcInput" type="text" placeholder="Message…" autocomplete="off" />
          <button id="pcSend">↑</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Login overlay -->
  <div id="login" class="overlay">
    <div class="box">
      <div class="login-logo">GameGram Chat</div>
      <p class="login-sub">Public rooms · powered by hack.chat</p>
      <input id="nickInput" placeholder="Nickname" autocomplete="off" />
      <input id="roomInput" placeholder="Room (default: gamegram)" autocomplete="off" />
      <button id="loginBtn" class="big-btn">Join Room</button>
      <p class="login-hint">Commands: /roll · /flip · /ttt · /room name · /help · /clear</p>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="../" class="back-link">← Games</a>
      <span id="roomLabel" class="room-name">#gamegram</span>
    </div>

    <div class="sidebar-section-label">Rooms</div>
    <div id="roomPanel" class="room-panel"></div>

    <div class="sidebar-section-label">Online</div>
    <div id="userList"></div>

    <div class="self">
      <div class="me">
        <div class="me-top">
          <span id="selfEmoji" class="self-emoji">🎮</span>
          <span id="meName">Guest</span>
        </div>
        <span id="statusDot" class="status-dot disconnected">Connecting…</span>
      </div>
      <button id="settingsBtn" title="Profile & Settings">⚙</button>
    </div>
  </aside>

  <!-- Chat panel -->
  <main class="chat">
    <header class="chat-header">
      <span id="chatRoomDisplay">#gamegram</span>
      <div class="chat-header-btns">
        <button class="hdr-btn" id="cmdHelpBtn">/? Help</button>
        <button class="hdr-btn" id="shareRoomBtn">🔗 Share</button>
      </div>
    </header>

    <div id="messages"></div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display:none">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span id="typingText">someone is typing...</span>
    </div>

    <!-- Scroll-to-bottom + unread badge -->
    <button class="scroll-down" id="scrollDown" style="display:none">
      <span id="scrollDownCount">0</span> new
    </button>

    <!-- Reply bar -->
    <div class="reply-bar" id="replyBar" style="display:none">
      <span class="reply-bar-label">Replying to</span>
      <span class="reply-bar-name" id="replyBarName">--</span>
      <span class="reply-bar-text" id="replyBarText">--</span>
      <button class="reply-bar-close" id="replyBarClose">✕</button>
    </div>

    <footer class="chat-footer">
      <button class="footer-icon-btn" id="emojiBtn" title="Emoji picker">😀</button>
      <button class="footer-icon-btn" id="gameShareBtn" title="Share a game in chat">🎮</button>
      <input id="input" type="text" placeholder="Message #gamegram" autocomplete="off" />
      <button id="send">Send</button>
    </footer>

    <!-- Emoji picker overlay -->
    <div class="emoji-picker" id="emojiPicker" style="display:none">
      <div class="emoji-picker-header">
        <span class="emoji-picker-title">Emoji</span>
        <button class="emoji-picker-close" id="emojiPickerClose">✕</button>
      </div>
      <div class="emoji-picker-grid" id="emojiPickerGrid">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>

  <!-- Profile & Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Profile &amp; Settings</h2>
        <button id="closeSettings" class="close-btn">✕</button>
      </div>
      <div class="settings">
        <label>Nickname
          <input id="nickInputSettings" autocomplete="off" placeholder="Your display name" />
        </label>
        <label>Name Color
          <input type="color" id="nickColor" value="#8b5cf6" />
        </label>
        <label>Avatar Emoji
          <div class="emoji-pick-grid" id="emojiPickGrid">
            🎮 🎯 🏆 🚀 ⚔️ 🛡️ 🐉 👾 🎲 🃏 🔥 ⚡ 💎 🌟 🎭 🦊
            🐺 🐸 🤖 👻 💀 🧙 🥷 🎸 🌈 🌙 ☄️ 🍄 🏴 🎃 🐦 🦁
          </div>
          <input type="hidden" id="emojiVal" value="🎮" />
        </label>
        <label>Theme
          <select id="themeSelect">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>Message Style
          <select id="msgStyle">
            <option value="cozy">Cozy</option>
            <option value="compact">Compact</option>
          </select>
        </label>
        <label>Font Size
          <input type="range" id="fontSize" min="12" max="20" value="14" />
        </label>
      </div>
      <div class="settings-footer">
        <a href="../customize/" target="_blank" class="settings-ext-link">Full Customize ↗</a>
        <button id="saveSettings" class="big-btn settings-save">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
